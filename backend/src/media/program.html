<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Delayed program</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080d15;color:white;font:14px system-ui}
body{display:flex;flex-direction:column;overflow:auto}#viewport{position:relative;flex:1 0 180px;min-height:180px;isolation:isolate;overflow:hidden}
#stage,#model-stage{position:absolute;inset:0}video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;background:#080d15}
#model-stage{background:radial-gradient(ellipse,#202b34,#080d15)}#model-stage gs-vehicle-viewer{display:block;width:100%;height:100%;position:relative}
#program-bar{flex:none;display:grid;grid-template-columns:100px minmax(0,1fr);gap:10px;padding:10px 12px;background:#101923;border-top:1px solid #344454}
#rocket-inset{grid-row:1 / 3;align-self:center;width:100%;min-width:0;text-align:center}#rocket-inset svg{display:block;width:100%;height:100px}#rocket-phase{font-size:11px;overflow-wrap:anywhere}
#banner{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:10px;font-variant-numeric:tabular-nums;min-width:0}.name{font-size:10px;color:#9aaebb;text-transform:uppercase;letter-spacing:.08em}.value{margin-top:4px;overflow-wrap:anywhere}
#playback-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}#status{font-size:12px;color:#b9c9d5;flex:1 1 150px}#status:empty{display:none}
#stream-sound{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{font:inherit;background:#24374b;color:white;border:1px solid #697e8e;border-radius:6px;padding:7px 10px;cursor:pointer}input[type=range]{width:85px;max-width:100%}#audio-status{font-size:11px;color:#b9c9d5}
@media(max-width:420px){#program-bar{grid-template-columns:72px minmax(0,1fr);padding:8px;gap:8px}#rocket-inset svg{height:88px}#banner{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}#playback-controls{grid-column:1 / -1}}
</style>
<div id="viewport"><div id="stage"></div><div id="model-stage"></div></div><footer id="program-bar" aria-label="Program status"><div id="rocket-inset" aria-label="Delayed rocket state"><svg viewBox="0 0 100 180" role="img" aria-label="Single-stage rocket"><g id="chute" style="display:none"><path d="M10 32 Q50 -8 90 32Z" fill="#e5ecf2"/><path d="M10 32L50 63L90 32" fill="none" stroke="#99afc0"/></g><path d="M40 145L28 159V130L40 120M60 145L72 159V130L60 120" fill="#8498a8"/><path d="M40 145V68L50 45L60 68V145Z" fill="#e5ecf2"/><path id="flame" d="M42 148L50 175L58 148Z" fill="#ff984a" style="display:none"/></svg><div id="rocket-phase">Unknown</div></div><div id="banner"></div><div id="playback-controls"><div id="status" role="status">Building delayed program buffer…</div><div id="stream-sound"></div></div></footer><script src="/assets/hls.min.js"></script><script type="module" src="/assets/three/vehicle-renderer.js"></script>
<script>
'use strict';
const stage=document.querySelector('#stage'),status=document.querySelector('#status'),banner=document.querySelector('#banner');
const ticket=new URLSearchParams(location.search).get('ticket'),players=new Map();
let state,clockOffset=0,lastPoll=0,displayed='',stopped=false;
const supportsVideo=typeof Hls!=='undefined'&&Hls.isSupported();
window.gsStreamSound={muted:true,volume:1};
function sound(video){video.muted=window.gsStreamSound.muted;video.volume=window.gsStreamSound.volume;}
window.addEventListener('gs-stream-sound',()=>{for(const p of players.values())sound(p.video);});
const serverNow=()=>Date.now()+clockOffset;
function modelDisplay(videoReady){
 const holder=document.querySelector('#model-stage'),inset=document.querySelector('#rocket-inset');
 const fresh=state&&lastPoll&&performance.now()-lastPoll<=2500;
 const telemetry=fresh?state.telemetry:null;
 const phase=telemetry?.phase||'Unknown';
 const onGround=['Startup','Idle','PreFill','FillTest','NitrogenFill','NitrousFill','Armed'].includes(phase);
 const svg=inset.querySelector('svg');
 let equipment=svg.querySelector('#ground-equipment');
 if(!equipment){
  equipment=document.createElementNS('http://www.w3.org/2000/svg','g');equipment.id='ground-equipment';
  equipment.innerHTML='<g fill="#d9e3ea" stroke="#7e96a8" stroke-width="2"><rect x="-100" y="100" width="24" height="55" rx="10"/><rect x="-66" y="82" width="28" height="73" rx="12"/><rect x="-91" y="160" width="58" height="12" rx="2"/></g><path d="M-88 155V165H-52V155M-52 155V165H40M81 160V45H94V160M81 65H94M81 90H94M81 115H94M81 140H94M81 70H61" fill="none" stroke="#7e96a8" stroke-width="3"/><path d="M-100 121H-76" stroke="#45a8ed" stroke-width="5"/><path d="M-66 110H-38" stroke="#49d1ac" stroke-width="5"/><path d="M-108 176H100" stroke="#7e96a8" stroke-width="3"/>';
  svg.insertBefore(equipment,svg.firstChild);
 }
 equipment.style.display=onGround?'':'none';
 svg.setAttribute('viewBox',onGround?'-110 0 215 180':'0 0 100 180');
 
 inset.setAttribute('aria-label',onGround?'Delayed rocket and fill equipment':'Delayed rocket state');
 holder.style.display=videoReady?'none':'block';
 if(videoReady){holder.replaceChildren();}else{
  let model=holder.querySelector('gs-vehicle-viewer');if(!model&&customElements.get('gs-vehicle-viewer')){model=document.createElement('gs-vehicle-viewer');holder.append(model);}
  const config=state?.model;
  const ground=onGround;
  const src=(ground?(config?.ground_model_url||'/assets/models/gse-site.glb'):config?.model_url)||'/assets/models/vehicle.glb';if(model&&model.getAttribute('src')!==src)model.setAttribute('src',src);
  const neutral={motions:(config?.motions||[{node:'motor-flame',transform:'visible',axis:[0,1,0],from:0,to:1},{node:'main-parachute',transform:'scale',axis:[1,1,1],from:.001,to:1},{node:'drogue-parachute',transform:'scale',axis:[1,1,1],from:.001,to:1}]).map(m=>({...m,value:0})),clip:'',attitude:[0,0,0]};
  const groundState={motions:[],attitude:[0,0,0],clip:telemetry?.phase==='NitrogenFill'?'nitrogen-test':telemetry?.phase==='NitrousFill'?'nitrous-fill':''};
  model?.setAttribute('data-state',JSON.stringify(ground?groundState:telemetry?.model_state||neutral));
 }
 document.querySelector('#rocket-phase').textContent=phase;
 document.querySelector('#flame').style.display=phase==='Ascent'?'':'none';
 document.querySelector('#chute').style.display=['ParachuteDeploy','Descent','Landed','Recovery'].includes(phase)?'':'none';
}
function remove(id){const p=players.get(id);if(p){p.hls.destroy();p.video.remove();players.delete(id);}}
function create(feed){
 const video=document.createElement('video');sound(video);video.playsInline=true;video.preload='auto';video.setAttribute('aria-label',feed.label);stage.append(video);
 const hls=new Hls({autoStartLoad:false,lowLatencyMode:false,maxBufferLength:12,maxMaxBufferLength:20,backBufferLength:5,liveSyncDuration:3,liveMaxLatencyDuration:85,maxLiveSyncPlaybackRate:1,enableWorker:true});
 const p={video,hls,details:null,started:false,ready:false,failed:false,lastFrame:0,lastSeek:-Infinity};players.set(feed.id,p);
 hls.on(Hls.Events.MANIFEST_PARSED,()=>hls.startLoad(-1));
 hls.on(Hls.Events.LEVEL_LOADED,(_,data)=>{p.details=data.details;});
 hls.on(Hls.Events.ERROR,(_,data)=>{if(data.fatal){p.failed=true;video.style.opacity=0;}});
 hls.attachMedia(video);hls.loadSource(feed.url);
 if(video.requestVideoFrameCallback){const frame=()=>{p.lastFrame=performance.now();if(!stopped&&players.get(feed.id)===p)video.requestVideoFrameCallback(frame);};video.requestVideoFrameCallback(frame);}
}
function card(name,value){const card=document.createElement('div'),a=document.createElement('div'),b=document.createElement('div');a.className='name';b.className='value';a.textContent=name;b.textContent=value;card.append(a,b);banner.append(card);}
function drawBanner(){banner.replaceChildren();card('Mission',state.broadcast.label||'Program');card('Video delay',state.broadcast.delay_seconds+' s');const telemetry=state.telemetry;card('T clock',telemetry?.t_clock||'—');if(!telemetry){card('Telemetry','Buffering delayed telemetry');return;}card('Flight phase',telemetry.phase);const page=Math.floor(serverNow()/5000)%Math.max(1,Math.ceil(telemetry.stats.length/3));for(const stat of telemetry.stats.slice(page*3,page*3+3)){card(stat.label,stat.value==null?'—':Number(stat.value).toFixed(stat.precision)+' '+stat.unit);}}
async function poll(){
 try{
  const start=Date.now(),r=await fetch('/api/media-assets/program/state?ticket='+encodeURIComponent(ticket),{cache:'no-store'});if(!r.ok)throw Error('Program unavailable');const next=await r.json();clockOffset=next.server_now_ms-(start+Date.now())/2;
  if(state&&next.broadcast.delay_seconds!==state.broadcast.delay_seconds){for(const id of [...players.keys()])remove(id);displayed='';}
  state=next;lastPoll=performance.now();
  window.gsProgramAudioState={enabled:state.broadcast.comms_audio_enabled,delay:state.broadcast.delay_seconds,fresh:true};window.dispatchEvent(new CustomEvent("gs-program-audio-state",{detail:window.gsProgramAudioState}));
  // Decode only the featured camera in hero mode, especially on the Pi.
  const feeds=state.broadcast.layout==='grid'?state.streams:state.streams.filter(s=>s.id===(state.streams.find(s=>s.id===state.broadcast.featured_stream_id)||state.streams[0])?.id);
  const ids=new Set(feeds.map(s=>s.id));for(const id of [...players.keys()])if(!ids.has(id))remove(id);
  for(const feed of feeds){if(players.get(feed.id)?.failed)remove(feed.id);if(supportsVideo&&!players.has(feed.id))create(feed);}
  drawBanner();
 }catch(e){status.textContent='Program unavailable — delayed feed paused';lastPoll=0;window.gsProgramAudioState={enabled:false,fresh:false};window.dispatchEvent(new CustomEvent("gs-program-audio-state",{detail:window.gsProgramAudioState}));}
 if(!stopped)setTimeout(poll,500);
}
function render(){
 if(stopped)return;
 if(!state||!lastPoll||performance.now()-lastPoll>2500){for(const p of players.values()){p.video.pause();p.video.style.opacity=0;}modelDisplay(false);return;}
 const target=serverNow()-state.broadcast.delay_seconds*1000-2500;
 for(const p of players.values()){
  p.ready=false;const fragments=p.details?.fragments||[];
  const f=fragments.find(f=>f.programDateTime!=null&&f.programDateTime<=target&&f.endProgramDateTime>target);
  if(!f){p.video.pause();p.video.style.opacity=0;continue;}
  const desired=f.start+(target-f.programDateTime)/1000;
  if(!p.started){p.started=true;p.hls.startLoad(desired);}
  const playing=p.hls.playingDate?.getTime();
  // Let a seek finish and a slow decoder present a frame before seeking again.
  if((playing==null||Math.abs(playing-target)>1500)&&!p.video.seeking&&performance.now()-p.lastSeek>1500){try{p.video.currentTime=desired;p.lastSeek=performance.now();}catch{}p.video.style.opacity=0;}
  const time=p.hls.playingDate?.getTime();
  const frameFresh=!p.video.requestVideoFrameCallback||performance.now()-p.lastFrame<1500;
  p.ready=!p.failed&&time!=null&&Math.abs(time-target)<1500&&p.video.readyState>=2&&!p.video.seeking&&frameFresh;
  p.video.play().catch(()=>{});
 }
 const preferred=players.has(state.broadcast.featured_stream_id)?state.broadcast.featured_stream_id:state.streams[0]?.id;
 if(state.broadcast.layout==='grid'){
  const entries=[...players.entries()],columns=stage.clientWidth<500?1:entries.length<=1?1:entries.length<=4?2:3,rows=Math.ceil(entries.length/columns);let ready=0;
  entries.forEach(([id,p],i)=>{p.video.style.zIndex='1';p.video.style.width=100/columns+'%';p.video.style.height=100/rows+'%';p.video.style.left=(i%columns)*100/columns+'%';p.video.style.top=Math.floor(i/columns)*100/rows+'%';p.video.style.opacity=p.ready?'1':'0';if(p.ready)ready++;});
  status.textContent=!supportsVideo?'H.264 video playback unavailable in this browser':ready?'':state.streams.length?'Buffering delayed video — model view':'No active camera — model view';displayed='';modelDisplay(ready>0);
 }else{
  for(const p of players.values()){p.video.style.width='100%';p.video.style.height='100%';p.video.style.left='0';p.video.style.top='0';}
  displayed=players.get(preferred)?.ready?preferred:'';
  for(const [id,p]of players){p.video.style.zIndex=id===displayed?'2':'1';p.video.style.opacity=id===displayed&&p.ready?'1':'0';}
  status.textContent=!supportsVideo?'H.264 video playback unavailable in this browser':players.get(displayed)?.ready?'':state.streams.length?'Buffering delayed video — model view':'No active camera — model view';modelDisplay(!!players.get(displayed)?.ready);
 }
}
const timer=setInterval(render,100);
if(!supportsVideo){status.textContent='This browser cannot play delayed video; showing the model.';}poll();
window.addEventListener('pagehide',()=>{stopped=true;clearInterval(timer);for(const id of [...players.keys()])remove(id);});
</script><script type="module" src="/assets/program-audio.js"></script></html>
