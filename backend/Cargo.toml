[package]
name = "groundstation_backend"
version = "0.1.0"
edition = "2024"
description.workspace = true
license-file.workspace = true
repository.workspace = true

[features]
raspberry_pi = ["rppal"]
testing = []
hitl_mode = []
test_fire_mode = []

[dependencies]
gse_sequence = { path = "../shared/gse_sequence" }
axum = { workspace = true, features = ["ws"] }
tokio.workspace = true
serde_json.workspace = true
rppal = { git = "https://gitlab.rylanswebsite.com/rylan-meilutis/rppal.git", branch = "main", optional = true }
SEDSnet = "4"

sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring", "sqlite"] }

anyhow = "1.0.104"
tower-http = { version = "0.7.1", features = ["fs", "compression-full"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serialport = "4.10.1"
futures = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
base64 = "0.23.1"
ring = "0.17.14"
reqwest = { version = "0.13.5", default-features = true, features = ["json", "rustls"] }
whatlang = "0.18.0"
flexi_logger = "0.31.10"
log = "0.4.34"
time = { version = "0.3.55", features = ["formatting", "macros"] }
