[package]
name = "paired_settings"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
[features]
sqlite-journal = ["dep:sqlx"]

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
anyhow = "1"
base64 = "0.22"
ring = "0.17"

sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"], optional = true }

[dev-dependencies]
tokio = { workspace = true }
