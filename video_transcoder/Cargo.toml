[package]
name = "gs-video-transcoder"
version = "0.1.0"
edition = "2024"
license-file = "../LICENSE"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23.1"
dioxus = { version = "0.7.10", default-features = false, features = ["desktop", "launch", "lib"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io", "rt"] }
url = "2.5.8"

[workspace]
