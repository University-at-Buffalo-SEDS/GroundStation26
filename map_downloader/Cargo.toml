[package]
name = "map_downloader"
description.workspace = true
license-file.workspace = true
repository.workspace = true
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "fs"] }
reqwest = { version = "0.13.5", features = ["rustls"] }
indicatif = "0.18.6"
futures = "0.3.34"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring", "sqlite"] }
blake3 = "1.8.7"

[[bin]]
name = "map_downloader"
path = "src/main.rs"
